name: PhonePad
options:
  bundleIdPrefix: com.cinnamobot
  deploymentTarget:
    iOS: "17.0"
targets:
  PhonePad:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cinnamobot.phonepad
        PRODUCT_NAME: PhonePad
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PhonePad
        NSBluetoothAlwaysUsageDescription: PCへBluetoothでマウスとキーボードの入力を送るために使用します
        UIBackgroundModes:
          - bluetooth-peripheral
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
